        '201':
          description: Created
          content:
            application/json:
              schema:
                allOf:
                  - title: IndividualPayeTestSupportSaEmploymentsAnnualSummaryResponse
                    required: &ref_17
                      - employments
                    type: object
                    properties: &ref_18
                      employments:
                        type: array
