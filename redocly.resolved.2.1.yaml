                    description: Create Individual Employment summary test data response
              examples:
                happy-path-1:
                  description: Response for scenario HAPPY_PATH_1 with all fields present
                  value:
                    employments:
                      - employerPayeReference: 123/AB456
                        employerName: Company XYZ
