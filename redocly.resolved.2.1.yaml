openapi: 3.0.3
info:
  title: Individual PAYE Test Support
  version: '2.1'
servers:
  - url: https://test-api.service.hmrc.gov.uk
paths:
  /individual-paye-test-support/sa/{utr}/benefits/annual-summary/{taxYear}:
    post:
      tags:
        - individual-paye-test-support
      summary: Create benefits summary test data
      description: Supports the [Individual Benefits API](https://developer.service.hmrc.gov.uk/api-documentation/docs/api/service/individual-benefits) by creating benefits summary test data.
      operationId: createBenefitsSummaryTestData
      parameters:
        - name: utr
          in: path
          description: The 10 digit self assessment UTR for the individual.
          required: true
          style: simple
          schema: &ref_0
            type: string
            example: 2234567890
        - name: taxYear
          in: path
          description: The tax year for the benefits test data being created.
          required: true
          style: simple
          schema:
            pattern: ^[0-9]{4}-[0-9]{2}$
            type: string
            example: 2016-17
        - name: Accept
          in: header
          style: simple
          description: Specifies the response format and the [version](/api-documentation/docs/reference-guide#versioning) of the API to be used.
          schema: &ref_1
            type: string
            enum:
              - application/vnd.hmrc.2.1+json
          required: true
        - name: Content-Type
          in: header
          style: simple
          description: Specifies the format of the request body, which must be JSON.
          schema: &ref_2
            type: string
            enum:
              - application/json
          required: true
        - name: Authorization
          in: header
          style: simple
          description: An [OAuth 2.0 Bearer Token](/api-documentation/docs/authorisation/application-restricted-endpoints).
          schema: &ref_3
            type: string
            example: Bearer 59fc92c1cdf0b8ef1f138a702effdbd2
          required: true
      requestBody:
        content:
          application/json:
            schema:
              allOf:
                - title: individualPayeTestSupportSaBenefitsAnnualSummaryRequest
                  type: object
                  properties: &ref_12
                    scenario:
                      oneOf:
                        - title: firstScenario
                          enum: &ref_4
                            - HAPPY_PATH_1
                          type: string
                          description: Standard happy path test scenario (default)
                        - title: secondScenario
                          enum: &ref_6
                            - HAPPY_PATH_2
                          type: string
                          description: Happy path test scenario with only mandatory fields
                      description: The scenario to create test data for Individual Benefits
                  description: Create Individual Benefits summary test data request
            examples:
              happy-path-1:
                description: Payload for scenario HAPPY_PATH_1
                value: &ref_5
                  scenario: HAPPY_PATH_1
              happy-path-2:
                description: Payload for scenario HAPPY_PATH_2
                value: &ref_7
                  scenario: HAPPY_PATH_2
        required: true
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                allOf:
                  - title: individualPayeTestSupportSaBenefitsAnnualSummaryResponse
                    required: &ref_13
                      - employments
                    type: object
                    properties: &ref_14
                      employments:
                        type: array
                        items:
                          title: employment
                          required:
                            - employerPayeReference
                          type: object
                          properties:
                            employerPayeReference:
                              type: string
                              description: The employer's PAYE reference.
                              example: 123/AB456
                            companyCarsAndVansBenefit:
                              type: number
                              description: The total value of company cars and vans.
                              example: 44
                            fuelForCompanyCarsAndVansBenefit:
                              type: number
                              description: The total value of fuel for company cars and vans.
                              example: 99
                            privateMedicalDentalInsurance:
                              type: number
                              description: The total value of private medical and dental treatment and insurance.
                              example: 64
                            vouchersCreditCardsExcessMileageAllowance:
                              type: number
                              description: The value of benefits in the form of vouchers, credit cards and excess mileage allowance.
                              example: 80
                            goodsEtcProvidedByEmployer:
                              type: number
                              description: The total value of goods and other assets provided by the employer.
                              example: 125
                            accommodationProvidedByEmployer:
                              type: number
                              description: The total value of accommodation provided by the employer.
                              example: 375
                            otherBenefits:
                              type: number
                              description: The total value of other benefits, including interest-free loans and loans below the HMRC official rates.
                              example: 16
                            expensesPaymentsReceived:
                              type: number
                              description: The value of expenses payments received and balancing charges.
                              example: 415
                        description: An unordered list of one or more employments for which the taxpayer reported any benefits for the given tax year
                    description: Create Individual Benefits summary test data response
              examples:
                happy-path-1:
                  description: Response for scenario HAPPY_PATH_1 with all fields present
                  value:
                    employments:
                      - employerPayeReference: 123/AB456
                        companyCarsAndVansBenefit: 44
                        fuelForCompanyCarsAndVansBenefit: 99
                        privateMedicalDentalInsurance: 64
                        vouchersCreditCardsExcessMileageAllowance: 80
                        goodsEtcProvidedByEmployer: 125
                        accommodationProvidedByEmployer: 375
                        otherBenefits: 16
                        expensesPaymentsReceived: 415
                      - employerPayeReference: 456/AB456
                        companyCarsAndVansBenefit: 50
                        fuelForCompanyCarsAndVansBenefit: 249
                        privateMedicalDentalInsurance: 75
                        vouchersCreditCardsExcessMileageAllowance: 23
                        goodsEtcProvidedByEmployer: 250
                        accommodationProvidedByEmployer: 275
                        otherBenefits: 87
                        expensesPaymentsReceived: 265
                happy-path-2:
                  description: Response for scenario HAPPY_PATH_2 with only mandatory fields present
                  value:
                    employments:
                      - employerPayeReference: 123/AB456
      deprecated: false
      security:
        - application-restricted: []
  /individual-paye-test-support/sa/{utr}/child-benefit-entitlement/annual-summary/{taxYear}:
    post:
      tags:
        - individual-paye-test-support
      summary: Create Child Benefit entitlement test data
      description: Supports the [Individual Benefits API](https://developer.service.hmrc.gov.uk/api-documentation/docs/api/service/individual-benefits) by creating Child Benefit entitlement test data.
      operationId: createChildBenefitEntitlementTestData
      parameters:
        - name: utr
          in: path
          description: The 10 digit self assessment UTR for the individual.
          required: true
          style: simple
          schema: *ref_0
        - name: taxYear
          in: path
          description: The tax year for the Child Benefit entitlement test data that is being created. Although production data will only be available for a portion of the current Self Assessment year, that policy is not enforced for the data that is created in the sandbox environment by this operation.
          required: true
          style: simple
          schema:
            pattern: ^[0-9]{4}-[0-9]{2}$
            type: string
            example: 2025-26
        - name: Accept
          in: header
          style: simple
          description: Specifies the response format and the [version](/api-documentation/docs/reference-guide#versioning) of the API to be used.
          schema: *ref_1
          required: true
        - name: Content-Type
          in: header
          style: simple
          description: Specifies the format of the request body, which must be JSON.
          schema: *ref_2
          required: true
        - name: Authorization
          in: header
          style: simple
          description: An [OAuth 2.0 Bearer Token](/api-documentation/docs/authorisation/application-restricted-endpoints).
          schema: *ref_3
          required: true
      requestBody:
        content:
          application/json:
            schema:
              allOf:
                - title: individualPayeTestSupportChildBenefitEntitlementRequest
                  type: object
                  properties: &ref_15
                    scenario:
                      oneOf:
                        - title: firstScenario
                          enum: *ref_4
                          type: string
                          description: Standard happy path test scenario (default)
                        - title: happy404Scenario
                          enum: &ref_8
                            - HAPPY_PATH_2
                          type: string
                          description: Happy path test scenario for HTTP 404 response
                        - title: unhappy500Scenario
                          enum: &ref_9
                            - UNHAPPY_PATH_500
                          type: string
                          description: Unhappy path test scenario for HTTP 500 response
                      description: The scenario for which to create Child Benefit entitlement test data.
                  description: Create Child Benefit entitlement test data request
            examples:
              happy-path-1:
                description: Payload for scenario HAPPY_PATH_1
                value: *ref_5
              happy-path-2:
                description: Payload for scenario HAPPY_PATH_2
                value: &ref_10
                  scenario: HAPPY_PATH_2
              unhappy-path-500:
                description: Payload for scenario UNHAPPY_PATH_500
                value: &ref_11
                  scenario: UNHAPPY_PATH_500
        required: true
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                allOf:
                  - title: individualPayeTestSupportChildBenefitEntitlementResponse
                    type: object
                    required:
                      - expectedStatus
                    properties:
                      expectedStatus:
                        type: number
                        description: The HTTP response status code that should be expected from the [Individual Benefits API](https://developer.service.hmrc.gov.uk/api-documentation/docs/api/service/individual-benefits) in the specified scenario.
                        example: 200
                      expectedJson:
                        type: object
                        required:
                          - childBenefitEntitlement
                        properties:
                          childBenefitEntitlement:
                            type: number
                            description: The amount of Child Benefit entitlement.
                            example: 450.99
              examples:
                happy-path-1:
                  description: Response for scenario HAPPY_PATH_1, showing an amount of child benefit entitlement.
                  value:
                    expectedStatus: 200
                    expectedJson:
                      childBenefitEntitlement: 215.49
                happy-path-2:
                  description: Response for scenario HAPPY_PATH_2.
                  value:
                    expectedStatus: 404
                unhappy-path-500:
                  description: Response for scenario UNHAPPY_PATH_500.
                  value:
                    expectedStatus: 500
      deprecated: false
      security:
        - application-restricted: []
